[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ni-radio-datalogger"
version = "0.1.1"
description = "Interface graphique d'acquisition analogique NI USB-6009"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "PySide6>=6.7,<7",
    "pyqtgraph>=0.13.7,<1",
    "nidaqmx>=1.0,<2",
]

[project.gui-scripts]
ni-radio-datalogger = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["radio_datalogger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
