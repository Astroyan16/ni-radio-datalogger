name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.lock.txt
      - name: Install pinned build environment
        run: python -m pip install -r requirements-build.lock.txt
      - name: Test, build and verify the Windows executable
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Python python
      - name: Upload executable and portable archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ni-radio-datalogger-windows-x64
          path: dist/*
          if-no-files-found: error
      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-test-evidence
          path: artifacts/smoke-exe/
          if-no-files-found: warn
